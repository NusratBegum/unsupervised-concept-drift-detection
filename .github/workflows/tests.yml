name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.13 and the pinned packages
        run: |
          uv venv --python 3.13
          uv pip install -r requirements-lock.txt
      # test/datasets needs the USP CSVs, which are not in git
      - name: Unit tests that need no dataset files
        run: .venv/bin/python -m pytest -q test --ignore=test/datasets
      - name: Quick-start example (synthetic stream, no data files)
        run: .venv/bin/python examples/quickstart.py
